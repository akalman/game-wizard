name: Game-Wizard Example Visual Novel


# basic engine boilerplate. load any resources from modules you want to use and then configure
# when and where the game should start and end.
modules:
- res://modules/core/config.yaml
initial-scene: initial-cutscene
# initial-scene: world-map


# define what state our game needs to track. this can be used to track story event flags,
# arbitrary state enums, numerical values, and collections of database entries.
state:
  # we will have three npcs each of which will have state independently tracked as a flag. anything
  # that can be represented as a bound set of strings can be represented as a flag. flags support
  # membership conditions and can only be set to specific values.
  flags:
    shopkeep-progress:
      values: [ unseen, open, success, fail ]
      initial-value: unseen

    enthusiast-progress:
      values: [ unseen, open, success, fail ]
      initial-value: unseen

    stranger-progress:
      values: [ unseen, open, success, fail ]
      initial-value: unseen

    shopkeep-in-dialog:
      values: [ yes, no ]
      initial-value: no

    enthusiast-in-dialog:
      values: [ yes, no ]
      initial-value: no

    stranger-in-dialog:
      values: [ yes, no ]
      initial-value: no

    shopkeep-wants-beans:
      values: [ known, unknown ]
      initial-value: unknown

    found-shop-beans:
      values: [ yes, no ]
      initial-value: no

    found-house-beans:
      values: [ yes, no ]
      initial-value: no

    found-sign-beans:
      values: [ yes, no ]
      initial-value: no

    stranger-asked-transfer:
      values: [ yes, no ]
      initial-value: no

    stranger-asked-rooftop:
      values: [ yes, no ]
      initial-value: no

    stranger-asked-festival:
      values: [ yes, no ]
      initial-value: no

    enthusiast-knows-rocks:
      values: [ yes, no ]
      initial-value: no

    enthusiast-agreed-trade:
      values: [ yes, no ]
      initial-value: no


  attributes:
    shopkeep-familiarity:
      min: 0
      max: 3
      initial-value: 0

    enthusiast-familiarity:
      min: 0
      max: 3
      initial-value: 0

    stranger-familiarity:
      min: 0
      max: 3
      initial-value: 0

    money:
      min: 0
      max: 99999
      initial-value: 0

    rocks-mined:
      min: 0
      max: 5
      initial-value: 0

  bags:
    inventory:
      db: items

database:
  characters: res://examples/visual-novel/db/characters.yaml
  outfits: res://examples/visual-novel/db/outfits.yaml
  npcs: res://examples/visual-novel/db/npcs.yaml
  items: res://examples/visual-novel/db/items.yaml


# game wizard modules contain special types of godot scenes called scene templates.  these are
# scenes that can be re-used across many different parts of your game by using configuration.
# each scene below is a named combination of a scene template and a configuration file.
scenes:

  # TODO: add in main menu to example

  # create an introductory cutscene that brings the player up to speed on the game premise. After
  # which go to the world map.
  initial-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/initial-cutscene.yaml
    transitions:
      - edge: terminal-frame.done move to world-map

  # the main world map scene used to navigate between npcs. logic related to how the scene acts
  # internally is located within the template documentation. as an example, for this scene logic
  # around what npcs are available and when the ending location is shown are handled by the
  # template.
  world-map:
    template: core.landmark-overworld
    config: res://examples/visual-novel/scenes/world-map.yaml
    transitions:
      # create a subscription to spawn each cutscene for each npc
      - edge: navigate.shopkeep-landmark spawn shopkeep-location
      - edge: navigate.enthusiast-landmark spawn enthusiast-location
      - edge: navigate.stranger-landmark spawn stranger-location
      # conditionally navigate to the win or lose cutscene depending on current game state. order
      # matters here since only the first matching subscriber in this list will handle the event.
      - edge: navigate.ending-landmark spawn win-cutscene
        when:
        - flag shopkeep-progress in [success]
        - flag enthusiast-progress in [success]
        - flag stranger-progress in [success]
      - edge: navigate.mining-landmark spawn mining-cutscene
      - edge: navigate.ending-landmark spawn lose-cutscene

  shopkeep-location:
    template: core.landmark-overworld
    config: res://examples/visual-novel/scenes/shopkeep/shopkeep-location.yaml
    transitions:
      - edge: navigate.npc spawn shopkeep-cutscene
        updates:
          - set flag shopkeep-in-dialog to yes
          - add 1 to attribute shopkeep-familiarity
        when:
          - attribute shopkeep-familiarity less than 3
      - edge: navigate.npc spawn shopkeep-cutscene
        updates:
          - set flag shopkeep-in-dialog to yes
      - edge: navigate.back-button ends
      - edge: navigate.can-of-beans do nothing
        updates:
          - add 1 of item can-of-beans to bag inventory
          - set flag found-shop-beans to yes

  # create scenes for each npc. we start with the shopkeep npc. the first scene is the conversation
  # with the npc itself. dialog routing is done internally.
  shopkeep-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/shopkeep/shopkeep-cutscene.yaml
    transitions:
        # when input from a user is needed, we spawn a child scene in response to the
        # dialog-interlude event.
      - edge: dialog-interlude.shopkeep-topics spawn shopkeep-dialog-topics
        updates:
          - set flag shopkeep-progress to open
        when:
          - flag shopkeep-progress in [unseen]
      - edge: dialog-interlude.shopkeep-topics spawn shopkeep-dialog-topics
      - edge: dialog-interlude.buy-flag-options spawn shopkeep-buy-flag-options
      - edge: terminal-frame.purchase-farewell ends
        updates:
          - set flag shopkeep-in-dialog to no
      - edge: terminal-frame.nevermind ends
        updates:
          - set flag shopkeep-in-dialog to no

  # create a scene for selecting what topic to discuss with the shopkeep npc
  shopkeep-dialog-topics:
    template: core.menu
    config: res://examples/visual-novel/scenes/shopkeep/shopkeep-dialog-topics.yaml
    transitions:
      # omitted transitions will default based on the template config, so adding transitions
      # like these isn't necessary but allows for adding updates and conditional logic.
      - edge: terminal-select.ask-for-flags ends
      - edge: terminal-select.ask-about-beans ends
      - edge: terminal-select.ask-for-pickaxe ends
        updates:
          - add 1 of item pickaxe to bag inventory
      - edge: terminal-select.hows-business ends
      - edge: terminal-select.nevermind ends

  # create a scene for the different ways buying a flag could resolve
  shopkeep-buy-flag-options:
    template: core.menu
    config: res://examples/visual-novel/scenes/shopkeep/shopkeep-buy-flag-options.yaml
    transitions:
      - edge: terminal-select.heres-the-money ends
        updates:
          - set flag shopkeep-progress to success
      - edge: terminal-select.heres-beans ends
        updates:
          - set flag shopkeep-progress to success
      - edge: terminal-select.no-money ends
        updates:
          - set flag shopkeep-wants-beans to known
      - edge: terminal-select.nevermind ends

  # do the same for each other npc.
  # enthusiast
  enthusiast-location:
    template: core.landmark-overworld
    config: res://examples/visual-novel/scenes/enthusiast/enthusiast-location.yaml
    transitions:
      - edge: navigate.npc spawn enthusiast-cutscene
        updates:
          - set flag enthusiast-in-dialog to yes
          - add 1 to attribute enthusiast-familiarity
        when:
          - attribute enthusiast-familiarity less than 3
      - edge: navigate.npc spawn enthusiast-cutscene
        updates:
          - set flag enthusiast-in-dialog to yes
      - edge: navigate.back-button ends
      - edge: navigate.can-of-beans do nothing
        updates:
          - add 1 of item can-of-beans to bag inventory
          - set flag found-house-beans to yes

  enthusiast-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/enthusiast/enthusiast-cutscene.yaml
    transitions:
      - edge: dialog-interlude.enthusiast-topics spawn enthusiast-dialog-topics
        updates:
          - set flag enthusiast-progress to open
        when:
          - flag enthusiast-progress in [unseen]
      - edge: dialog-interlude.enthusiast-topics spawn enthusiast-dialog-topics
      - edge: dialog-interlude.flag-quiz spawn enthusiast-flag-quiz
      - edge: terminal-frame.success ends
        updates:
          - set flag enthusiast-in-dialog to no
      - edge: terminal-frame.trade-success ends
        updates:
          - set flag enthusiast-progress to success
          - set flag enthusiast-in-dialog to no
          - remove 1 of item rock-perfect from bag inventory
      - edge: terminal-frame.fail ends
        updates:
          - set flag enthusiast-in-dialog to no
      - edge: terminal-frame.nevermind ends
        updates:
          - set flag enthusiast-in-dialog to no

  # create a scene for selecting what topic to discuss with the enthusiast npc
  enthusiast-dialog-topics:
    template: core.menu
    config: res://examples/visual-novel/scenes/enthusiast/enthusiast-dialog-topics.yaml
    transitions:
      - edge: terminal-select.tell-me-about-flags ends
        updates:
          - set flag enthusiast-knows-rocks to yes
      - edge: terminal-select.trade-for-rock ends
        updates:
          - set flag enthusiast-agreed-trade to yes
      - edge: terminal-select.deliver-rock ends
      - edge: terminal-select.flag-test ends
      - edge: terminal-select.how-many-flags ends
      - edge: terminal-select.nevermind ends

  # create a scene for the flag worthiness quiz
  enthusiast-flag-quiz:
    template: core.menu
    config: res://examples/visual-novel/scenes/enthusiast/enthusiast-flag-quiz.yaml
    transitions:
      - edge: terminal-select.success ends
        updates:
          - set flag enthusiast-progress to success
      - edge: terminal-select.fail ends
        updates:
          - set flag enthusiast-progress to fail
      - edge: terminal-select.open ends

  # stranger
  stranger-location:
    template: core.landmark-overworld
    config: res://examples/visual-novel/scenes/stranger/stranger-location.yaml
    transitions:
      - edge: navigate.npc spawn stranger-cutscene
        updates:
          - set flag stranger-in-dialog to yes
      - edge: navigate.back-button ends
      - edge: navigate.can-of-beans do nothing
        updates:
          - add 1 of item can-of-beans to bag inventory
          - set flag found-sign-beans to yes

  stranger-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/stranger/stranger-cutscene.yaml
    transitions:
      - edge: dialog-interlude.stranger-topics spawn stranger-dialog-topics
        updates:
          - set flag stranger-progress to open
        when:
          - flag stranger-progress in [unseen]
      - edge: dialog-interlude.stranger-topics spawn stranger-dialog-topics
      - edge: dialog-interlude.quiz-transfer spawn stranger-quiz-transfer
      - edge: dialog-interlude.quiz-rooftop spawn stranger-quiz-rooftop
      - edge: dialog-interlude.quiz-festival spawn stranger-quiz-festival
      - edge: terminal-frame.success ends
        updates:
          - set flag stranger-progress to success
          - set flag stranger-in-dialog to no
      - edge: terminal-frame.fail ends
        updates:
          - set flag stranger-progress to fail
          - set flag stranger-in-dialog to no
      - edge: terminal-frame.nevermind ends
        updates:
          - set flag stranger-in-dialog to no

  # create a scene for selecting what topic to discuss with the stranger npc
  stranger-dialog-topics:
    template: core.menu
    config: res://examples/visual-novel/scenes/stranger/stranger-dialog-topics.yaml
    transitions:
      - edge: terminal-select.about-corners ends
      - edge: terminal-select.quiz-transfer ends
      - edge: terminal-select.quiz-rooftop ends
      - edge: terminal-select.quiz-festival ends
      - edge: terminal-select.ask-for-flag ends
      - edge: terminal-select.nevermind ends

  # create scenes for each stranger etiquette quiz. correct answers increase
  # favorability, incorrect answers do not.
  stranger-quiz-transfer:
    template: core.menu
    config: res://examples/visual-novel/scenes/stranger/stranger-quiz-transfer.yaml
    transitions:
      - edge: terminal-select.right-transfer ends
        updates:
          - add 1 to attribute stranger-familiarity
          - set flag stranger-asked-transfer to yes
      - edge: terminal-select.wrong-transfer ends
        updates:
          - set flag stranger-asked-transfer to yes

  stranger-quiz-rooftop:
    template: core.menu
    config: res://examples/visual-novel/scenes/stranger/stranger-quiz-rooftop.yaml
    transitions:
      - edge: terminal-select.right-rooftop ends
        updates:
          - add 1 to attribute stranger-familiarity
          - set flag stranger-asked-rooftop to yes
      - edge: terminal-select.wrong-rooftop ends
        updates:
          - set flag stranger-asked-rooftop to yes

  stranger-quiz-festival:
    template: core.menu
    config: res://examples/visual-novel/scenes/stranger/stranger-quiz-festival.yaml
    transitions:
      - edge: terminal-select.right-festival ends
        updates:
          - add 1 to attribute stranger-familiarity
          - set flag stranger-asked-festival to yes
      - edge: terminal-select.wrong-festival ends
        updates:
          - set flag stranger-asked-festival to yes

  # create a mining cutscene that awards rocks of increasing quality. the mining landmark
  # on the world map is only visible once the player has a pickaxe, and disappears after
  # all five rocks have been mined.
  mining-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/mining/mining-cutscene.yaml
    transitions:
      - edge: terminal-frame.mined-crumbly ends
        when:
          - attribute rocks-mined less than 1
        updates:
          - add 1 of item rock-crumbly to bag inventory
          - add 1 to attribute rocks-mined
      - edge: terminal-frame.mined-rough ends
        when:
          - attribute rocks-mined less than 2
        updates:
          - add 1 of item rock-rough to bag inventory
          - add 1 to attribute rocks-mined
      - edge: terminal-frame.mined-decent ends
        when:
          - attribute rocks-mined less than 3
        updates:
          - add 1 of item rock-decent to bag inventory
          - add 1 to attribute rocks-mined
      - edge: terminal-frame.mined-shiny ends
        when:
          - attribute rocks-mined less than 4
        updates:
          - add 1 of item rock-shiny to bag inventory
          - add 1 to attribute rocks-mined
      - edge: terminal-frame.mined-perfect ends
        when:
          - attribute rocks-mined less than 5
        updates:
          - add 1 of item rock-perfect to bag inventory
          - add 1 to attribute rocks-mined

  # define the ending cutscenes. use quit event action.
  win-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/win-cutscene.yaml
    transitions:
      - edge: terminal-frame.end quit
  lose-cutscene:
    template: core.dialog-cutscene
    config: res://examples/visual-novel/scenes/lose-cutscene.yaml
    transitions:
      - edge: terminal-frame.end quit
