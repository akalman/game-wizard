map:
  sprite: res://examples/visual-novel/sprites/world-map.png
  scaling: fit-width

landmarks:

  shopkeep-landmark:
    sprite: res://examples/visual-novel/sprites/world-map-landmark.png
    size: ( 200 200 )
    offset: ( -0.25 -0.7 )
    when:
      - flag shopkeep-progress in [unseen,open]

  enthusiast-landmark:
    sprite: res://examples/visual-novel/sprites/world-map-landmark.png
    size: ( 200 200 )
    offset: ( 0.4 -0.2 )
    when:
      - flag enthusiast-progress in [unseen,open]

  stranger-landmark:
    sprite: res://examples/visual-novel/sprites/world-map-landmark.png
    size: ( 200 200 )
    offset: ( -0.65 0.45 )
    when:
      - flag enthusiast-progress in [unseen,open]

  ending-landmark:
    sprite: res://examples/visual-novel/sprites/world-map-landmark.png
    size: ( 200 200 )
    offset: ( 0.4 0.4 )
    when:
      - flag shopkeep-progress in [success,fail]
      - flag enthusiast-progress in [success,fail]
      - flag stranger-progress in [success,fail]
