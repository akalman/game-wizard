initial-sequence: route-coversation


style:
  background: res://examples/visual-novel/sprites/50-px-darken.png
  banner:
    background: res://examples/visual-novel/sprites/dialog-banner-background.png
    height: 50
  characters:
    outer-margin: 50
  dialog-box:
    background: res://examples/visual-novel/sprites/dialog-box-background.png
    height: 350
    text-size: ( 1750 230 )
    text-offset: ( 0 40 )
    speaker-name-size: ( 200 50 )
    speaker-name-offset: ( -1650 -260 )


characters: characters
outfits: outfits


interludes:
  question:
    transitions:
      - source: terminal-select.open
        action: start open
      - source: terminal-select.success
        action: start success
      - source: terminal-select.fail
        action: start fail


sequences:

  route-coversation:
    transitions:
      - action: start initial
        when:
          - flag stranger-progress in [unseen]
      - action: start revisit

  initial:
    transitions:
      - action: start shared
    frames:
      - mc added to Left
      - mc puts on mc-regular-clothes
      - mc puts on mc-face-neutral
      - |
        mc says
        Ok let me just go around this corner and—

      - stranger added to Right
      - stranger puts on npc-regular-clothes
      - stranger puts on npc-face-angry
      - mc puts on mc-face-surprised
      - |
        mc says
        [b]BONK.[/b]

      - mc puts on mc-face-weirded-out
      - |
        mc says
        OW! Oh god I'm so sorry I didn't see you
        there I— my toast! I dropped my toast!

      - |
        stranger says
        No. No no no. Stop. You didn't say
        the line.

      - |
        mc says
        ...the line? What line? I just physically
        collided with you.

      - |
        stranger says
        When you crash into someone at a corner
        you have to SAY THE LINE. Everyone knows this. It's like
        the most important part. The crash means nothing without
        the line.

      - mc puts on mc-face-neutral
      - |
        mc says
        I genuinely have no idea what you're talking
        about.

      - stranger puts on npc-face-weirded-out
      - |
        stranger says
        Ok look. I'll give you a flag if you
        do this right. But you have to say the line. I've been
        standing at this corner ALL DAY waiting for someone to
        crash into me and say it.

      - mc puts on mc-face-weirded-out
      - |
        mc says
        That's... honestly kind of sad.

      - stranger puts on npc-face-angry
      - |
        stranger says
        It's not SAD it's TRADITION. Now. Let's
        try this again.

  revisit:
    transitions:
      - action: start shared
    frames:
      - mc added to Left
      - mc puts on mc-regular-clothes
      - mc puts on mc-face-neutral
      - |
        mc says
        Ok, the corner person. Let me just—

      - stranger added to Right
      - stranger puts on npc-regular-clothes
      - stranger puts on npc-face-weirded-out
      - mc puts on mc-face-surprised
      - |
        mc says
        [b]BONK.[/b]

      - stranger puts on npc-face-happy
      - |
        stranger says
        Good, you're back. Very committed
        crash this time. Really felt that one in my ribs. Now
        are you ready to say the line?

      - mc puts on mc-face-weirded-out
      - |
        mc says
        I'm going to be honest, I walked away last
        time and still have no idea what the line is. But let's
        do this.

  shared:
    transitions:
      - action: interlude question
    frames:
      - stranger puts on npc-face-neutral
      - |
        stranger says
        Ok. The scene is set. You've just
        rounded a corner at speed and crashed directly into me,
        a stranger. Now. What do you say?

      - mc puts on mc-face-neutral
      - |
        mc says
        Can I get a hint?

      - stranger puts on npc-face-angry
      - |
        stranger says
        NO HINTS. This is about INSTINCT. It's
        about what your HEART tells you to say when you slam into
        a stranger at a corner. Just pick one. You'll know the
        right answer when you feel it.

  success:
    transitions:
      - action: end
    frames:
      - stranger puts on npc-face-surprised
      - |
        stranger says
        ...

      - stranger puts on npc-face-happy
      - |
        stranger says
        YES!! "I'M LATE! I'M LATE!" THAT'S
        THE LINE!! YOU SAID IT!! OH MY GOD!!

      - |
        stranger says
        Do you know how LONG I've been standing
        at this corner?! WEEKS! And nobody ever says the line!!
        They just say "sorry" or "ow" like ANIMALS!!

      - |
        stranger says
        Here! Take this flag! You've earned it!
        You are a person of CULTURE and TASTE and PROPER
        CORNER-COLLISION ETIQUETTE!

      - stranger removed
      - mc puts on mc-face-weirded-out
      - |
        mc says
        Got a flag because I said "I'm late" after
        bumping into someone. Sure. This is the reality I'm
        trying to save. Ok. Now they can finally go to school
        I guess.

  fail:
    transitions:
      - action: end
    frames:
      - stranger puts on npc-face-surprised
      - |
        stranger says
        ...what?

      - stranger puts on npc-face-weirded-out
      - |
        stranger says
        That's... ok I need a minute. I need
        to go process that. Stay right here. I'll be back. I
        just need to go around the corner and think about what
        you just said to me.

      - stranger removed
      - mc puts on mc-face-weirded-out
      - |
        mc says
        Ok. I'll just wait here I guess. They
        seemed pretty shaken up. Maybe I should have just
        said the line.

      - mc puts on mc-face-neutral
      - |
        mc says
        ...they've been gone for a while. Let me
        go check around the corner.

      - mc puts on mc-face-surprised
      - |
        mc says
        Oh. Oh no. They're dead. They are actually
        dead. On the ground. Behind the corner. What.

      - |
        mc says
        Did... did I do that?! Was it the thing I
        said?! That's not how that's supposed to work!! It's
        just a THING PEOPLE SAY!

      - mc puts on mc-face-weirded-out
      - |
        mc says
        Ok I need to leave. Right now. Before
        someone sees me standing next to a dead stranger behind
        a corner. No flag. No nothing. I'm just going to walk
        away very quickly and never speak of this again.

  open:
    transitions:
      - action: end
    frames:
      - stranger puts on npc-face-surprised
      - |
        stranger says
        What did you just say to me?

      - stranger puts on npc-face-angry
      - |
        stranger says
        How do you know about that?! WHO SENT
        YOU?! I KNEW they were watching! I KNEW the corner was
        compromised!

      - mc puts on mc-face-surprised
      - |
        mc says
        I don't— I literally just said sounds! I
        was guessing! I don't know what any of this is!

      - |
        stranger says
        Leave. NOW. And don't come back until
        you've lost their trail. I can't be seen with you while
        they're listening. Go. Walk around. Act natural. Come
        back when you're CLEAN.

      - stranger removed
      - mc puts on mc-face-weirded-out
      - |
        mc says
        I don't know who "they" are. I don't know
        what trail I'm losing. But sure. I'll go walk around
        and come back and pretend that accomplished something.
