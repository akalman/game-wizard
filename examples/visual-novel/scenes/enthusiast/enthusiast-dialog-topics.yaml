initial-page: dialog-topics


style:
  background: res://examples/visual-novel/sprites/50-px-darken.png
  options:
    sprite: res://examples/visual-novel/sprites/dialog-choice-button.png
    size: ( 800 200 )


pages:

  dialog-topics:
    cancel-action: none
    options:
      tell-me-about-flags:
        action: end
        label: |
          "Tell me about your flag collection."
        when:
          - flag enthusiast-progress: in [open]
      how-many-flags:
        action: end
        label: |
          "How many flags do you have exactly?"
        when:
          - flag enthusiast-progress: in [open]
      trade-for-rock:
        action: end
        label: |
          "So about those rocks you mentioned..."
        when:
          - flag enthusiast-progress: in [open]
          - flag enthusiast-knows-rocks: in [yes]
          - flag enthusiast-agreed-trade: in [no]
      deliver-rock:
        action: end
        label: |
          "I found the perfect rock for you!"
        when:
          - flag enthusiast-progress: in [open]
          - flag enthusiast-agreed-trade: in [yes]
          - bag inventory: more than 0 rock-perfect
      flag-test:
        action: end
        label: |
          "I'm ready for the flag test."
        when:
          - flag enthusiast-progress: in [open]
      nevermind:
        action: end
        label: |
          "I gotta go, I'll be back later."
