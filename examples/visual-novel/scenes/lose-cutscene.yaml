initial-sequence: conversation


style:
  background: res://examples/visual-novel/sprites/50-px-darken.png
  banner:
    background: res://examples/visual-novel/sprites/dialog-banner-background.png
    height: 50
  characters:
    outer-margin: 50
  dialog-box:
    background: res://examples/visual-novel/sprites/dialog-box-background.png
    height: 350
    text-margin: ( 30 20 )


characters: characters
outfits: outfits


sequences:

  conversation:
    transitions:
      - action: start end
    frames:
      - mc added to Left
      - mc puts on mc-regular-clothes
      - mc puts on mc-face-weirded-out
      - |
        mc says
        [b]You:[/b] Ok so I talked to everyone and I definitely
        did not get all three flags. Some of those conversations
        did not go great.

      - future-mc added to Right
      - future-mc puts on mc-regular-clothes
      - future-mc puts on mc-face-angry
      - |
        future-mc says
        [b]Future You:[/b] Yeah I can see that. I'm literally
        flickering right now. That's not a good sign for the
        whole "reality staying intact" thing.

      - |
        mc says
        [b]You:[/b] In my defense, one of those people had 247
        named flags and I panicked.

      - future-mc puts on mc-face-neutral
      - |
        future-mc says
        [b]Future You:[/b] Well this is awkward. Reality is
        going to collapse now. The good news is it'll be quick.
        The bad news is everything. Everything is the bad news.

      - |
        mc says
        [b]You:[/b] So... no coffee then?

      - |
        future-mc says
        [b]Future You:[/b] No coffee. No anything. It was nice
        being us though. For the like twenty minutes it lasted.
        Bye, me.

      - future-mc removed
      - |
        mc says
        [b]You:[/b] Well. That's the end of everything I guess.
        Should have been nicer to people. Lesson l-

  end:
    transitions:
      - action: end
