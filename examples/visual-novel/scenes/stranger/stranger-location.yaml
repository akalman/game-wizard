map:
  sprite: res://examples/visual-novel/sprites/stranger-background.png
  scaling: fit-width


landmarks:

  npc:
    sprite: res://examples/visual-novel/sprites/stranger-saunter.png
    size: ( 150 400 )
    offset: ( 0.4 -0.25 )
    when:
      - flag stranger-in-dialog: in [no]

  can-of-beans:
    sprite: res://examples/visual-novel/sprites/can-of-beans.png
    size: ( 50 50 )
    offset: ( -0.64 -0.88 )
    when:
      - flag found-sign-beans: in [no]

  back-button:
    sprite: res://examples/visual-novel/sprites/back.png
    size: ( 200 100 )
    offset: ( 0.7 -0.9 )
