initial-sequence: conversation


style:
  background: res://examples/visual-novel/sprites/50-px-darken.png
  banner:
    background: res://examples/visual-novel/sprites/dialog-banner-background.png
    height: 50
  characters:
    outer-margin: 50
  dialog-box:
    background: res://examples/visual-novel/sprites/dialog-box-background.png
    height: 350
    text-size: ( 1750 230 )
    text-offset: ( 0 40 )
    speaker-name-size: ( 200 50 )
    speaker-name-offset: ( -1650 -260 )


characters: characters
outfits: outfits


sequences:

  conversation:
    transitions:
      - action: start end
    frames:
      - mc enters: on Left
      - mc puts on: mc-regular-clothes
      - mc puts on: mc-face-happy
      - mc says: |
          I did it! I got all three flags! From a
          lonely shopkeep, an unhinged flag enthusiast, and a
          person who's been lurking at a corner waiting for
          someone to crash into them!

      - future-mc enters: on Right
      - future-mc puts on: mc-regular-clothes
      - future-mc puts on: mc-face-neutral
      - future-mc says: |
          Oh hey nice you actually did it.
          I'm honestly surprised. I figured you'd mess up at
          least one of them.

      - mc puts on: mc-face-weirded-out
      - mc says: |
          Thanks for the vote of confidence. So
          is reality saved now?

      - future-mc puts on: mc-face-happy
      - future-mc says: |
          Yep! Spacetime is intact! The
          timeline is preserved! Everything is exactly as it
          should be! Probably! I'm not a scientist!

      - mc puts on: mc-face-neutral
      - mc says: |
          Great. Can I go get my coffee now?

      - future-mc says: |
          Yeah go for it. You earned it.
          I already had mine. It was pretty good. You're gonna
          love it. Later, me!

      - future-mc leaves:
      - mc puts on: mc-face-happy
      - mc says: |
          Well that's that. I saved reality by being
          nice to people and answering questions correctly. What
          a day. What a weird, weird day.

  end:
    transitions:
      - action: end
