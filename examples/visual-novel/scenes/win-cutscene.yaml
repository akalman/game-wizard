initial-sequence: conversation


style:
  background: res://examples/visual-novel/sprites/50-px-darken.png
  banner:
    background: res://examples/visual-novel/sprites/dialog-banner-background.png
    height: 50
  characters:
    outer-margin: 50
  dialog-box:
    background: res://examples/visual-novel/sprites/dialog-box-background.png
    height: 350
    text-margin: ( 30 20 )


characters:
  mc:
    sprite: res://examples/visual-novel/sprites/char-masc-meso.png
  future-mc:
    sprite: res://examples/visual-novel/sprites/char-masc-meso.png


sequences:

  conversation:
    transitions:
      - action: start end
    frames:
      - type: add-character
        side: left
        character: mc
      - type: set-text
        character: mc
        text: |
            [b]You:[/b] I did it! I got all three flags! From a
            lonely shopkeep, an unhinged flag enthusiast, and a
            person who's been lurking at a corner waiting for
            someone to crash into them!

      - type: add-character
        side: right
        character: future-mc
      - type: set-text
        character: future-mc
        text: |
            [b]Future You:[/b] Oh hey nice you actually did it.
            I'm honestly surprised. I figured you'd mess up at
            least one of them.

      - type: set-text
        character: mc
        text: |
            [b]You:[/b] Thanks for the vote of confidence. So
            is reality saved now?

      - type: set-text
        character: future-mc
        text: |
            [b]Future You:[/b] Yep! Spacetime is intact! The
            timeline is preserved! Everything is exactly as it
            should be! Probably! I'm not a scientist!

      - type: set-text
        character: mc
        text: |
            [b]You:[/b] Great. Can I go get my coffee now?

      - type: set-text
        character: future-mc
        text: |
            [b]Future You:[/b] Yeah go for it. You earned it.
            I already had mine. It was pretty good. You're gonna
            love it. Later, me!

      - type: remove-character
        character: future-mc
      - type: set-text
        character: mc
        text: |
            [b]You:[/b] Well that's that. I saved reality by being
            nice to people and answering questions correctly. What
            a day. What a weird, weird day.

  end:
    transitions:
      - action: end
